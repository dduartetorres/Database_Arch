services:
  mysql:
    image: mysql:8.0
    container_name: libraryhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: libraryhub
      MYSQL_USER: library
      MYSQL_PASSWORD: library
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      # Init scripts run in alphabetical order; prefixes enforce schema -> procedures -> data.
      # queries.sql is evidence (and contains an intentionally failing CALL), so it is not run at init.
      - ./mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./mysql/procedures.sql:/docker-entrypoint-initdb.d/02-procedures.sql:ro
      - ./mysql/data.sql:/docker-entrypoint-initdb.d/03-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulibrary", "-plibrary"]
      interval: 5s
      timeout: 5s
      retries: 20

  cassandra:
    image: cassandra:4.1
    container_name: libraryhub-cassandra
    ports: ["9042:9042"]
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  # One-shot job: the Cassandra image has no init-script hook, so load the schema once it is healthy.
  cassandra-init:
    image: cassandra:4.1
    container_name: libraryhub-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra:/cassandra-init:ro
    entrypoint: ["cqlsh", "cassandra", "-f", "/cassandra-init/schema.cql"]
    restart: "no"

  mongodb:
    image: mongo:7
    container_name: libraryhub-mongodb
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro

  redis:
    image: redis:7
    container_name: libraryhub-redis
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: libraryhub-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # One-shot job: create the books index and bulk-load documents (MongoDB remains the source of truth).
  opensearch-init:
    image: curlimages/curl:8.8.0
    container_name: libraryhub-opensearch-init
    depends_on: [opensearch]
    volumes:
      - ./opensearch:/opensearch:ro
    entrypoint: ["sh", "/opensearch/init.sh"]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: libraryhub-clickhouse
    # Host port 19000 for the native protocol avoids clashes with other tools that commonly use 9000/9001 (e.g. MinIO).
    ports: ["8123:8123", "19000:9000"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # Prefixes enforce schema before data (init scripts run alphabetically).
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./clickhouse/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: libraryhub-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: libraryhub-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  mysql-data:
  cassandra-data:
  mongo-data:
  redis-data:
  opensearch-data:
  clickhouse-data:
